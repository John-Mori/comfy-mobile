<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="site-type" content="list-tool"><title>Comfy Mobile</title><link rel="stylesheet" href="style.css?v=20261110m">
</head><body><main>
<header><p class="eyebrow">自宅PCのComfyUI</p><h1>画像を作る</h1><p id="connection">接続先と合言葉を入れる</p></header>
<section class="card" id="connectionCard"><h2>接続</h2><label>Worker URL(PCとつなぐ受付の住所)<input id="workerUrl" type="url" inputmode="url" placeholder="https://...workers.dev"></label><label>合言葉<input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false"></label><button id="connect" type="button">接続する</button><p id="connectNote" class="note" role="alert"></p></section>
<form id="jobForm" class="card" hidden><h2>生成設定</h2><label>モデル<select id="checkpoint" required></select></label><div class="row"><label>LoRA 1(画風やキャラを足す追加学習)<select id="lora1"></select></label><label>強さ(LoRAの効き具合)<select id="strength1"><option>0.6</option><option selected>0.8</option><option>1.0</option><option>1.2</option></select></label></div><div class="row"><label>LoRA 2(2つ目の追加学習)<select id="lora2"></select></label><label>強さ(LoRAの効き具合)<select id="strength2"><option>0.6</option><option selected>0.8</option><option>1.0</option><option>1.2</option></select></label></div>
<label>ポジティブ(描いてほしいもの)<textarea id="positive" required rows="5" maxlength="6000"></textarea></label><label>ネガティブ(描いてほしくないもの)<textarea id="negative" rows="3" maxlength="6000"></textarea></label><div class="row"><label>サイズ<select id="size"><option>832x1216</option><option selected>1024x1024</option><option>1216x832</option><option>768x1344</option></select></label><label>枚数<select id="count"><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div><div class="row"><label>Steps(描き込む回数・多いほど細かく遅い)<select id="steps"><option>20</option><option selected>28</option><option>35</option><option>45</option></select></label><label>CFG(指示への従い方・高いほど言葉どおり)<select id="cfg"><option>5</option><option selected>7</option><option>8</option><option>10</option></select></label></div><div class="row"><label>Sampler(描き方の手順)<select id="sampler"><option>euler</option><option selected>dpmpp_2m</option><option>euler_ancestral</option></select></label><label>Scheduler(描き込みの配分)<select id="scheduler"><option selected>normal</option><option>karras</option><option>exponential</option></select></label></div><label>Seed(絵の元になる乱数・同じ数なら同じ絵・空欄でランダム)<input id="seed" type="number" inputmode="numeric" step="1"></label><button type="submit">生成する</button></form>
<section class="card" id="result" hidden><h2>結果</h2><p id="status" role="status"></p><img id="image" alt="生成結果" hidden><div id="moreImages"></div><div class="actions"><button id="sendDiscord" type="button" hidden>Discordへ送る</button><button id="deleteImage" class="secondary" type="button" hidden>削除する</button></div></section>
</main><script src="app.js?v=20261110m"></script></body></html>
